AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Red TeleCorp - portal y panel (React) como sitio web estático en S3 (HTTP). La API y Cognito siguen en HTTPS.
  Sin CloudFront: el Learner Lab no permite cloudfront:CreateDistribution ni CreateOriginAccessControl. Solo en us-east-1.

Resources:
  BucketWeb:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub redtelecorp-web-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  PoliticaBucket:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketWeb
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${BucketWeb.Arn}/*

Outputs:
  BucketWeb:
    Value: !Ref BucketWeb
  Url:
    Value: !GetAtt BucketWeb.WebsiteURL
