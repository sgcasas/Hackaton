AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Red TeleCorp - PARTE A (lado usuario), stack "redtelecorp-usuario" encima de la base de Casas
  (infra/template.yaml, stack "redtelecorp-base"). Usa sus tablas, cola y bucket por nombre
  (README §1) y no crea nada que esté en la base. Mismo template en us-east-1 y us-west-2.
  Pensado para AWS Academy Learner Lab: todo usa LabRole, no se crean roles IAM.

Parameters:
  Proyecto:
    Type: String
    Default: redtelecorp

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        PROYECTO: !Ref Proyecto
        TABLA_INCIDENCIAS: !Sub ${Proyecto}-incidencias
        TABLA_RED: !Sub ${Proyecto}-red
        TABLA_INCIDENTES: !Sub ${Proyecto}-incidentes
        TABLA_CLIENTES: !Sub ${Proyecto}-clientes
        TABLA_NOTIFICACIONES: !Sub ${Proyecto}-notificaciones
        TABLA_AGREGADOS: !Sub ${Proyecto}-agregados
        BUCKET: !Sub ${Proyecto}-${AWS::AccountId}-${AWS::Region}
        COLA_REPORTES_URL: !Sub https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${Proyecto}-reportes
        SF_INCIDENTE_ARN: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Proyecto}-incidente
        PARAM_PREFIX: !Sub /${Proyecto}

Resources:
  # Regla propia de A: máximo de reportes por DNI en la ventana (no está en la base).
  PTopeDni:
    Type: AWS::SSM::Parameter
    Properties: {Name: !Sub "/${Proyecto}/regla/tope_dni", Type: String, Value: "5"}

  ProcesarReporteFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Proyecto}-procesar-reporte
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      CodeUri: ../services/usuario/
      Handler: procesar_reporte.handler
      Description: Valida al cliente, ubica la zona, clasifica con IA, guarda, acusa y aplica la regla de 10/24 h.
      Events:
        Cola:
          Type: SQS
          Properties:
            Queue: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Proyecto}-reportes
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 2
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 5  # el Learner Lab tiene poca concurrencia; la cola absorbe el pico

  ApiOperadorFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Proyecto}-api-operador
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      CodeUri: ../services/usuario/
      Handler: api_operador.handler
      Description: Consulta del usuario y rutas del panel del operador.

  PermisoApiOperador:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiOperadorFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*

  # ---- Cognito (operadores) ----
  OperadoresPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${Proyecto}-operadores
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false

  OperadoresCliente:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${Proyecto}-panel
      UserPoolId: !Ref OperadoresPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      IdTokenValidity: 8
      AccessTokenValidity: 8
      TokenValidityUnits: {IdToken: hours, AccessToken: hours}

  # ---- API Gateway (REST) ----
  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${Proyecto}-api
      StageName: prod
      OpenApiVersion: "3.0.1"
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 500
          ThrottlingRateLimit: 200
      DefinitionBody:
        openapi: "3.0.1"
        info: {title: redtelecorp-api, version: "1.0"}
        x-amazon-apigateway-request-validators:
          cuerpo:
            validateRequestBody: true
            validateRequestParameters: false
        components:
          securitySchemes:
            cognito:
              type: apiKey
              name: Authorization
              in: header
              x-amazon-apigateway-authtype: cognito_user_pools
              x-amazon-apigateway-authorizer:
                type: cognito_user_pools
                providerARNs:
                  - !GetAtt OperadoresPool.Arn
          schemas:
            # Lo que manda el portal. codigo y fechaRegistro los agrega API Gateway (README §4).
            Reporte:
              type: object
              additionalProperties: false
              required: [dni, numero, canales, lat, lon, fechaHoraUsuario, tipo, descripcion]
              properties:
                dni: {type: string, pattern: "^[0-9]{8}$"}
                numero: {type: string, pattern: "^9[0-9]{8}$"}
                email: {type: string, maxLength: 120}
                celular: {type: string, pattern: "^\\+519[0-9]{8}$"}
                canales:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string, enum: [email, sms]}
                lat: {type: number, minimum: -90, maximum: 90}
                lon: {type: number, minimum: -180, maximum: 180}
                fechaHoraUsuario: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"}
                tipo: {type: string, enum: [SIN_INTERNET, SIN_LLAMADAS, SIN_SMS, LENTITUD, SIN_SENAL, OTRO]}
                descripcion: {type: string, minLength: 3, maxLength: 1000}
        paths:
          /reportes:
            post:
              x-amazon-apigateway-request-validator: cuerpo
              requestBody:
                required: true
                content:
                  application/json:
                    schema: {$ref: "#/components/schemas/Reporte"}
              responses:
                "202":
                  description: Reporte encolado
                  headers:
                    Access-Control-Allow-Origin: {schema: {type: string}}
                "500":
                  description: Error al encolar
                  headers:
                    Access-Control-Allow-Origin: {schema: {type: string}}
              # Integración DIRECTA con SQS: sin Lambda antes de la cola (P9).
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${Proyecto}-reportes
                credentials: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
                passthroughBehavior: never
                requestParameters:
                  integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
                requestTemplates:
                  application/json: "Action=SendMessage&MessageBody=$util.urlEncode($input.body)&MessageAttribute.1.Name=codigo&MessageAttribute.1.Value.DataType=String&MessageAttribute.1.Value.StringValue=$context.requestId&MessageAttribute.2.Name=fechaRegistro&MessageAttribute.2.Value.DataType=Number&MessageAttribute.2.Value.StringValue=$context.requestTimeEpoch"
                responses:
                  "2\\d{2}":
                    statusCode: "202"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: '{"codigo": "$context.requestId", "estado": "RECIBIDO", "region": "$context.domainName"}'
                  default:
                    statusCode: "500"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: '{"error": "No se pudo encolar el reporte"}'
          /reportes/{codigo}:
            get:
              parameters:
                - {name: codigo, in: path, required: true, schema: {type: string}}
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiOperadorFn.Arn}/invocations
          /operador/incidencias:
            get:
              security: [{cognito: []}]
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiOperadorFn.Arn}/invocations
          /operador/incidencias/{id}/estado:
            patch:
              security: [{cognito: []}]
              parameters:
                - {name: id, in: path, required: true, schema: {type: string}}
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiOperadorFn.Arn}/invocations
          /operador/incidentes:
            get:
              security: [{cognito: []}]
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiOperadorFn.Arn}/invocations
          /operador/incidentes/{id}/resolver:
            post:
              security: [{cognito: []}]
              parameters:
                - {name: id, in: path, required: true, schema: {type: string}}
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiOperadorFn.Arn}/invocations
          /operador/analitica/{tipo}:
            get:
              security: [{cognito: []}]
              parameters:
                - {name: tipo, in: path, required: true, schema: {type: string}}
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiOperadorFn.Arn}/invocations
          /operador/antenas:
            get:
              security: [{cognito: []}]
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiOperadorFn.Arn}/invocations
          /operador/zonas:
            get:
              security: [{cognito: []}]
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiOperadorFn.Arn}/invocations

  AlarmaErroresProcesarReporte:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Proyecto}-errores-procesar-reporte
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ProcesarReporteFn}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod
  UserPoolId:
    Value: !Ref OperadoresPool
  UserPoolClientId:
    Value: !Ref OperadoresCliente
